<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Войти — Реплика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,500;12..96,75..100,600;12..96,75..100,700;12..96,75..100,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --paper:#F2ECE0;--paper2:#EDE6D8;
  --ink:#14110D;--ink-s:#4A4339;--ink-m:#8A8174;
  --g:#1B6E4B;--gl:#2E8C63;--mint:#7BC470;--mint2:#9CE08F;
  --rust:#C04B26;
  --line:rgba(20,17,13,.12);
}
body{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  background:var(--paper);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* Декоративный фон — большие размытые цветные пятна */
.bg-orbs{position:fixed;inset:0;overflow:hidden;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
.orb1{width:600px;height:600px;background:#1B6E4B;top:-150px;left:-150px}
.orb2{width:500px;height:500px;background:#D49642;bottom:-100px;right:-100px;opacity:.4}
.orb3{width:400px;height:400px;background:#5A9BC5;top:50%;right:20%;opacity:.35}
.orb4{width:350px;height:350px;background:#9CE08F;bottom:20%;left:30%;opacity:.4}

/* Grain */
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.25;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08 0 0 0 0 .07 0 0 0 0 .05 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* LOGIN CARD — настоящее стекло с blur, но единственный элемент с этим эффектом */
.login-card{
  position:relative;z-index:10;
  background:rgba(242,236,224,.55);
  backdrop-filter:blur(32px) saturate(1.5);
  -webkit-backdrop-filter:blur(32px) saturate(1.5);
  border:1px solid rgba(255,255,255,.5);
  border-radius:24px;
  padding:44px 40px 36px;
  width:100%;max-width:420px;margin:24px;
  box-shadow:
    0 24px 64px rgba(20,17,13,.18),
    0 8px 16px rgba(20,17,13,.08),
    inset 0 1px 0 rgba(255,255,255,.7);
  animation:fadeIn .6s cubic-bezier(.22,1,.36,1);
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.lc-logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:28px;justify-content:center;
}
.lc-logo svg{width:36px;height:36px}
.lc-logo .wm{
  font-variation-settings:"opsz" 24,"wdth" 100,"wght" 700;
  font-size:22px;letter-spacing:-.028em;color:var(--ink);
}
.lc-logo .dot{color:var(--g)}

.lc-eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--g);
  text-align:center;margin-bottom:10px;
}
.lc-title{
  font-variation-settings:"opsz" 60,"wdth" 92,"wght" 600;
  font-size:30px;line-height:1.05;letter-spacing:-.028em;
  text-align:center;color:var(--ink);margin-bottom:8px;
}
.lc-title .accent{color:var(--g)}
.lc-subtitle{
  font-size:14px;color:var(--ink-s);text-align:center;
  margin-bottom:28px;line-height:1.55;
}

.lc-form{display:flex;flex-direction:column;gap:12px}
.lc-field{position:relative}
.lc-label{
  position:absolute;top:-7px;left:14px;
  background:var(--paper);padding:0 6px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-s);
}
.lc-input{
  width:100%;background:rgba(255,255,255,.45);
  border:1.5px solid var(--line);
  padding:14px 16px;border-radius:12px;
  font-family:'Bricolage Grotesque',sans-serif;font-size:15px;
  color:var(--ink);outline:none;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.lc-input::placeholder{color:var(--ink-m)}
.lc-input:hover{border-color:rgba(20,17,13,.25);background:rgba(255,255,255,.6)}
.lc-input:focus{
  border-color:var(--g);background:rgba(255,255,255,.7);
  box-shadow:0 0 0 4px rgba(27,110,75,.1);
}

.lc-btn{
  background:var(--ink);color:var(--paper);
  border:none;padding:14px 16px;border-radius:12px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  cursor:pointer;margin-top:8px;
  transition:background .18s,transform .15s,box-shadow .18s;
  box-shadow:0 4px 14px rgba(20,17,13,.15);
}
.lc-btn:hover{
  background:var(--g);transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(27,110,75,.4);
}
.lc-btn:active{transform:translateY(0)}

.lc-error{
  background:rgba(192,75,38,.08);border:1px solid rgba(192,75,38,.25);
  padding:11px 14px;border-radius:10px;font-size:13px;color:var(--rust);
  margin-bottom:14px;
}

.lc-foot{
  margin-top:24px;padding-top:20px;
  border-top:1px solid rgba(20,17,13,.08);
  text-align:center;
}
.lc-hint{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--ink-m);letter-spacing:.06em;line-height:1.7;
}
.lc-hint code{
  background:rgba(255,255,255,.4);
  border:1px solid rgba(20,17,13,.1);
  padding:2px 8px;border-radius:4px;font-size:11px;
  color:var(--ink);
}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<div class="login-card">
  <div class="lc-logo">
    <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
      <rect width="44" height="44" rx="10" fill="#1B6E4B"/>
      <rect x="11" y="9" width="5" height="26" fill="#F2ECE0"/>
      <path d="M15 9H29a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-7l-4 4v-4h-3Z" fill="#F2ECE0"/>
    </svg>
    <span class="wm">реплика<span class="dot">.</span></span>
  </div>

  <div class="lc-eyebrow">Платформа · Вход</div>
  <h1 class="lc-title">Добро <span class="accent">пожаловать</span>.</h1>
  <p class="lc-subtitle">Войдите в личный кабинет, чтобы создавать и управлять ботами.</p>

  {% if error %}
  <div class="lc-error">Неверный логин или пароль. Попробуйте ещё раз.</div>
  {% endif %}

  <form class="lc-form" method="POST" action="/login">
    <div class="lc-field">
      <span class="lc-label">Логин</span>
      <input class="lc-input" type="text" name="username" placeholder="Введите логин" required autofocus autocomplete="username"/>
    </div>
    <div class="lc-field">
      <span class="lc-label">Пароль</span>
      <input class="lc-input" type="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button class="lc-btn" type="submit">Войти в платформу →</button>
  </form>

  <div class="lc-foot">
    <div class="lc-hint">
      Тестовый доступ:<br>
      логин <code>Test1</code> · пароль <code>123TesT1</code>
    </div>
  </div>
</div>

</body>
</html>
